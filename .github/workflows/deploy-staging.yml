name: Deploy Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: new-code1-cf
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-code1-cf/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        run: npx wrangler d1 migrations apply inhal-poc-staging --remote --config wrangler.staging.toml

      - name: Seed staging admin
        env:
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          if [ -z "$STAGING_ADMIN_PASSWORD" ]; then
            echo "STAGING_ADMIN_PASSWORD belum diset; seed dilewati."
            exit 0
          fi
          npm run seed:staging -- --apply --remote --config wrangler.staging.toml

      - name: Deploy staging
        run: npx wrangler deploy --config wrangler.staging.toml

      - name: Smoke check
        run: |
          curl -4 -fsS --retry 5 --retry-delay 3 \
            https://inhal-form-staging.prodi.workers.dev/api/health
