name: Restore Drill Staging

on:
  workflow_dispatch:

concurrency:
  group: restore-drill-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: new-code1-cf
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-code1-cf/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export staging D1 (read-only)
        run: |
          RESTORE_DIR="$RUNNER_TEMP/restore-drill"
          mkdir -p "$RESTORE_DIR"
          npx wrangler d1 export inhal-poc-staging --remote \
            --config wrangler.staging.toml \
            --output="$RESTORE_DIR/staging.sql"

      - name: Verify source dump
        run: |
          RESTORE_DIR="$RUNNER_TEMP/restore-drill"
          node scripts/verify-backup.mjs "$RESTORE_DIR/staging.sql" \
            > "$RESTORE_DIR/verify-source.json"
          cat "$RESTORE_DIR/verify-source.json"

      - name: Import dump into local scratch D1
        run: |
          RESTORE_DIR="$RUNNER_TEMP/restore-drill"
          cat > "$RESTORE_DIR/wrangler.restore.toml" <<EOF
          name = "inhal-form-restore-drill"
          main = "$GITHUB_WORKSPACE/new-code1-cf/src/index.js"
          compatibility_date = "2024-12-30"
          compatibility_flags = ["nodejs_compat"]

          [assets]
          directory = "$GITHUB_WORKSPACE/new-code1-cf/public"
          binding = "ASSETS"
          run_worker_first = ["/api/*", "/", "/index.html"]

          [[d1_databases]]
          binding = "DB"
          database_name = "inhal-poc-restore-drill"
          database_id = "11111111-2222-4333-8444-555555555555"
          EOF

          npx wrangler d1 execute inhal-poc-restore-drill --local \
            --config "$RESTORE_DIR/wrangler.restore.toml" \
            --file="$RESTORE_DIR/staging.sql"

      - name: Re-export and verify restored database
        run: |
          RESTORE_DIR="$RUNNER_TEMP/restore-drill"
          npx wrangler d1 export inhal-poc-restore-drill --local \
            --config "$RESTORE_DIR/wrangler.restore.toml" \
            --output="$RESTORE_DIR/restored.sql"
          node scripts/verify-backup.mjs "$RESTORE_DIR/restored.sql" \
            > "$RESTORE_DIR/verify-restored.json"
          cat "$RESTORE_DIR/verify-restored.json"

          SOURCE="$RESTORE_DIR/verify-source.json" \
          RESTORED="$RESTORE_DIR/verify-restored.json" \
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const source = JSON.parse(readFileSync(process.env.SOURCE, "utf8"));
            const restored = JSON.parse(readFileSync(process.env.RESTORED, "utf8"));
            const tables = ["mahasiswa", "pengajuan", "master_kegiatan", "berita_acara", "berita_acara_admin"];
            const mismatches = tables.filter((table) => source.counts[table] !== restored.counts[table]);
            if (mismatches.length) {
              throw new Error("jumlah baris berubah: " + mismatches.join(", "));
            }
            console.log("Jumlah tabel inti cocok: " + JSON.stringify(restored.counts));
          '

      - name: Verify application reads restored data
        run: |
          RESTORE_DIR="$RUNNER_TEMP/restore-drill"
          npx wrangler dev --local \
            --config "$RESTORE_DIR/wrangler.restore.toml" \
            --ip 127.0.0.1 --port 8799 > "$RESTORE_DIR/dev.log" 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/api/health > "$RESTORE_DIR/health.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat "$RESTORE_DIR/dev.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat "$RESTORE_DIR/dev.log"
            exit 1
          fi

          npx wrangler d1 execute inhal-poc-restore-drill --local \
            --config "$RESTORE_DIR/wrangler.restore.toml" --json \
            --command "SELECT npm FROM mahasiswa ORDER BY npm LIMIT 1" \
            > "$RESTORE_DIR/sample-npm.json"
          NPM=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const rows = JSON.parse(readFileSync(process.argv[1], "utf8"));
            console.log(rows[0].results[0].npm);
          ' "$RESTORE_DIR/sample-npm.json")

          curl -fsS http://127.0.0.1:8799/api/registration-options > /dev/null
          curl -fsS "http://127.0.0.1:8799/api/portal/$NPM" > /dev/null
          curl -fsS -o /dev/null http://127.0.0.1:8799/portal

          echo "Health, opsi pendaftaran, portal mahasiswa, dan halaman portal dapat dibaca."

      - name: Write drill summary
        run: |
          RESTORE_DIR="$RUNNER_TEMP/restore-drill"
          {
            echo "## Restore drill staging"
            echo ""
            echo "- Waktu: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Dump staging: ekspor baca-saja dan verifikasi lulus"
            echo "- Restore: database lokal scratch, ekspor ulang lulus"
            echo "- Aplikasi: health, opsi pendaftaran, portal mahasiswa, dan portal lulus"
            echo "- Jumlah tabel inti:"
            echo '```json'
            cat "$RESTORE_DIR/verify-restored.json" | node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const data = JSON.parse(readFileSync(0, "utf8"));
              console.log(JSON.stringify(data.counts, null, 2));
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-evidence
          path: |
            ${{ runner.temp }}/restore-drill/verify-source.json
            ${{ runner.temp }}/restore-drill/verify-restored.json
            ${{ runner.temp }}/restore-drill/health.json
          if-no-files-found: ignore
          retention-days: 14
