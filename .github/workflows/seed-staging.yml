name: Seed Staging Admin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: new-code1-cf
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-code1-cf/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create or update staging admin
        run: npm run seed:staging -- --apply --remote --config wrangler.staging.toml
