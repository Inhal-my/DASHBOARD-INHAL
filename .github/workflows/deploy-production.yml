name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Terapkan migrasi D1 yang tertunda sebelum deploy
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: new-code1-cf
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-code1-cf/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Release tooling tests
        run: npm run test:scripts

      - name: CSP sync
        run: npm run csp:check

      - name: Show pending migrations
        run: npx wrangler d1 migrations list inhal-poc --remote

      - name: Record Time Travel bookmark
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 time-travel info inhal-poc --json

      - name: Apply pending migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply inhal-poc --remote

      - name: Deploy production
        run: npx wrangler deploy

      - name: Smoke check
        run: |
          curl -4 -fsS --retry 5 --retry-delay 3 \
            https://inhal-form.prodi.workers.dev/api/health
