name: CI

on:
  pull_request:
    paths:
      - 'new-code1-cf/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'new-code1-cf/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-code1-cf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-code1-cf/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Release tooling and backup script tests
        run: npm run test:scripts

      - name: CSP sync
        run: npm run csp:check

      - name: Migration guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            npm run migrations:check -- --base "$BASE_SHA"
          else
            npm run migrations:check
          fi

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/inhal-worker
