name = "inhal-form-staging"
main = "src/index.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.issues]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/index.html"]

[[d1_databases]]
binding = "DB"
database_name = "inhal-poc-staging"
database_id = "ca9a999b-51dc-4a0d-8588-edf25191aa5a"
